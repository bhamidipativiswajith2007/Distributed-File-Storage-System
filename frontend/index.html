<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Replicora</title>
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>

  <div class="container">
    <header>
      <h1>Replicora</h1>
      <p>Distributed File Storage System</p>
      <button id="logoutBtn" class="btn danger" style="display: none; margin-top: 10px;" type="button">Logout</button>
    </header>

    <!-- Auth Section -->
    <section id="authSection" class="card">
      <div class="auth-tabs">
        <button id="tabLogin" class="active" type="button">Login</button>
        <button id="tabRegister" type="button">Register</button>
      </div>
      
      <form id="authForm">
        <div style="margin-bottom: 12px;">
          <input type="text" id="username" placeholder="Username" required style="width: 100%; padding: 10px; border-radius: 4px; border: 1px solid var(--border-color);">
        </div>
        <div style="margin-bottom: 12px;">
          <input type="password" id="password" placeholder="Password" required style="width: 100%; padding: 10px; border-radius: 4px; border: 1px solid var(--border-color);">
        </div>
        <button type="submit" id="authSubmitBtn" class="btn primary" style="width: 100%;">Login</button>
      </form>
      <p id="authStatus" class="status-msg"></p>
    </section>

    <!-- Main App Section (Hidden by default) -->
    <main id="appSection" style="display: none;">
      <!-- Upload Section -->
      <section class="upload-section card">
        <h2>Upload a File</h2>
        <form id="uploadForm">
          <input type="file" id="fileInput" required />
          <button type="submit" id="uploadBtn" class="btn primary">Upload</button>
        </form>
        <p id="uploadStatus" class="status-msg"></p>
      </section>

      <!-- Files List Section -->
      <section class="files-section card">
        <h2>My Uploaded Files</h2>
        <table id="filesTable">
          <thead>
            <tr>
              <th>File Name</th>
              <th>Size</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="filesList">
            <!-- File rows will be injected here via JavaScript -->
          </tbody>
        </table>
        <p id="emptyState" class="empty-state">No files uploaded yet.</p>
      </section>
    </main>
  </div>

  <script src="app.js?v=4"></script>
</body>
</html>
